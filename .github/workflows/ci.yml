name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      CATALOG_TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/catalog_test
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/catalog_test
      LOGFIRE_SEND_TO_LOGFIRE: "false"
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: catalog_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d catalog_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.19"
          python-version: "3.14"
      - name: Run unit and catalog integration tests
        run: uv run --locked python -m unittest discover -s tests

  frontend:
    name: Frontend Worker build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Build the Cloudflare Worker
        run: pnpm build:cloudflare
      - name: Check the Wrangler bundle
        run: pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
